<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>macmon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306080c'/%3E%3Cpath d='M6 20l5-7 5 5 4-9 6 11' fill='none' stroke='%2338bdf8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- Safari「添加到程序坞」只用这两处的图标；仅有 SVG favicon 时会被放大成模糊的小图 -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="vendor/uPlot.min.css" />
    <link rel="stylesheet" href="dist/app.css" />
    <!-- 同步执行、早于首次绘制：app.js 是 defer 的，等它再设主题会先闪一下默认深色 -->
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("macmon-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script src="vendor/uPlot.iife.min.js"></script>
    <script defer src="app.js"></script>
    <script defer src="vendor/alpine.min.js"></script>
  </head>
  <body class="font-sans" x-data="dash">
    <main class="mx-auto max-w-7xl space-y-4 px-4 py-6 sm:px-6 sm:py-10">
      <!-- 顶栏 -->
      <header class="card flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between" style="--i: 0">
        <div class="absolute top-4 right-4 flex gap-1.5">
          <button type="button" class="tool-btn num text-[11px] font-semibold" @click="toggleLang" :title="t('switchLang')" :aria-label="t('switchLang')" x-text="lang === 'zh' ? 'EN' : '中'"></button>
          <button type="button" class="tool-btn" @click="cycleTheme" :title="t(`theme.${theme}`)" :aria-label="t(`theme.${theme}`)">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <g x-show="theme === 'system'"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></g>
              <g x-show="theme === 'light'"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></g>
              <g x-show="theme === 'dark'"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></g>
            </svg>
          </button>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-3 pr-20">
            <span class="label">macmon</span>
            <span
              class="inline-flex items-center gap-2 rounded-full border border-line px-2.5 py-1 text-xs font-medium"
              :style="`color: var(--${statusMeta.color})`"
            >
              <span class="live-dot" x-show="status === 'live'"></span>
              <span class="h-2 w-2 rounded-full bg-current" x-show="status !== 'live'"></span>
              <span x-text="statusMeta.text"></span>
            </span>
          </div>
          <h1 class="mt-2 truncate text-3xl font-semibold tracking-tight sm:text-4xl" x-text="soc?.chip_name ?? 'Apple Silicon'"></h1>
          <p class="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-sm text-muted">
            <template x-for="item in metaItems" :key="item">
              <span x-text="item"></span>
            </template>
          </p>
        </div>
        <div class="flex items-end gap-6 sm:text-right">
          <div>
            <div class="label" x-text="t('sysPower')"></div>
            <div class="mt-1 flex items-baseline gap-1 sm:justify-end">
              <span class="num text-4xl font-semibold text-power sm:text-5xl" x-num.w="m?.sys_power"></span>
              <span class="text-lg text-muted">W</span>
            </div>
          </div>
        </div>
      </header>

      <!-- 环形仪表 -->
      <section class="grid grid-cols-2 gap-4 lg:grid-cols-4">
        <template x-for="(g, idx) in gauges" :key="g.key">
          <div class="card flex flex-col items-center gap-3 text-center sm:flex-row sm:gap-4 sm:text-left" :style="`--i: ${idx + 1}`">
            <div class="relative h-24 w-24 shrink-0 sm:h-28 sm:w-28" :style="`color: var(--${g.color})`">
              <svg viewBox="0 0 100 100" class="h-full w-full -rotate-90">
                <circle cx="50" cy="50" r="42" fill="none" stroke-width="8" class="ring-track" />
                <circle
                  cx="50" cy="50" r="42" fill="none" stroke-width="8" stroke-linecap="round"
                  class="ring-bar" stroke="currentColor"
                  stroke-dasharray="263.894"
                  :stroke-dashoffset="263.894 * (1 - clamp01(g.value))"
                />
              </svg>
              <div class="absolute inset-0 grid place-items-center">
                <div class="flex items-baseline">
                  <span class="num text-2xl font-semibold text-fg sm:text-3xl" x-num.int="g.display"></span>
                  <span class="text-xs text-muted" x-text="g.unit"></span>
                </div>
              </div>
            </div>
            <div class="w-full min-w-0 space-y-1 sm:w-auto">
              <div class="label" x-text="g.label"></div>
              <template x-for="(line, li) in g.lines" :key="li">
                <div class="num truncate text-xs text-muted sm:text-sm" x-text="line"></div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <!-- 利用率趋势 + 功耗构成 -->
      <section class="grid gap-4 lg:grid-cols-3">
        <div class="card flex flex-col lg:col-span-2" style="--i: 5">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
            <div class="label" x-text="t('usage5m')"></div>
            <div class="flex gap-4 text-xs">
              <span class="flex items-center gap-1.5"><i class="h-2 w-2 rounded-full bg-cpu"></i>CPU <b class="num text-fg" x-num.pct="m?.cpu_active_ratio"></b></span>
              <span class="flex items-center gap-1.5"><i class="h-2 w-2 rounded-full bg-gpu"></i>GPU <b class="num text-fg" x-num.pct="m?.gpu_active_ratio"></b></span>
            </div>
          </div>
          <div x-ref="usageChart" class="chart min-h-56 w-full flex-1"></div>
        </div>

        <div class="card flex flex-col" style="--i: 6">
          <div class="label" x-text="t('powerBreakdown')"></div>
          <div class="mt-3 flex items-baseline justify-between">
            <div>
              <span class="num text-3xl font-semibold" x-num.w="m?.chip_power"></span>
              <span class="text-sm text-muted" x-text="`W ${t('chip')}`"></span>
            </div>
            <div class="text-right text-xs text-muted" x-show="m?.dc_in_power != null">
              <span x-text="t('adapter')"></span> <span class="num text-fg" x-num.w="m?.dc_in_power"></span> W
            </div>
          </div>
          <div class="mt-4 flex h-3 w-full overflow-hidden rounded-full bg-track">
            <template x-for="p in powerParts" :key="p.key">
              <span
                class="h-full transition-[width] duration-700 ease-out first:rounded-l-full"
                :style="`width: ${p.share * 100}%; background: ${p.bg}`"
              ></span>
            </template>
          </div>
          <ul class="mt-4 grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
            <template x-for="p in powerParts" :key="p.key">
              <li class="flex items-center justify-between gap-1">
                <span class="flex min-w-0 items-center gap-2 text-muted"><i class="h-2 w-2 shrink-0 rounded-full" :style="`background: ${p.bg}`"></i><span class="truncate" x-text="p.label"></span></span>
                <span class="num shrink-0 whitespace-nowrap"><span x-num.w="p.value"></span> <span class="text-faint">W</span></span>
              </li>
            </template>
          </ul>
          <div class="mt-auto pt-4">
            <div class="mb-1 flex justify-between text-xs text-faint"><span x-text="t('sysOverChip')"></span><span x-text="t('min5')"></span></div>
            <div x-ref="powerChart" class="chart h-16 w-full"></div>
          </div>
        </div>
      </section>

      <!-- CPU 核心 + 内存 -->
      <section class="grid gap-4 lg:grid-cols-3">
        <!-- 核心很多（Ultra）时 CPU 卡片会很高，并排会把内存卡片拉出大片空白，改为两张卡片各占整行 -->
        <div class="card" :class="manyCores ? 'lg:col-span-3' : 'lg:col-span-2'" style="--i: 7" x-ref="coreCard">
          <div class="label" x-text="t('cpuCores')"></div>
          <div class="mt-4 space-y-5">
            <template x-for="(tier, ti) in (m?.cpu_tiers ?? [])" :key="ti">
              <div>
                <div class="mb-2.5 flex flex-wrap items-baseline justify-between gap-x-3 text-sm" :style="`--c: var(--${tierColor(ti, m.cpu_tiers.length)})`">
                  <span class="flex items-center gap-2 font-medium">
                    <i class="h-2.5 w-2.5 rounded-[3px] bg-(--c)"></i>
                    <span class="text-(--c)" x-text="tierName(tier.label)"></span>
                    <span class="text-muted" x-text="t('nCores', tier.cores.length)"></span>
                  </span>
                  <span class="num text-muted">
                    <span x-num.int="tier.freq_mhz"></span><span class="text-faint" x-text="` / ${maxFreq(tier.label) || '—'} MHz`"></span> ·
                    <span class="text-fg" x-num.pct="tier.active_ratio"></span>%
                  </span>
                </div>
                <div class="grid gap-2" :style="`grid-template-columns: repeat(${coreCols(tier.cores.length)}, minmax(0, 1fr))`">
                  <template x-for="core in tier.cores" :key="coreKey(tier, core)">
                    <div
                      class="core-cell"
                      :class="core.active_ratio > 0.6 && 'is-hot'"
                      :style="`--c: var(--${tierColor(ti, m.cpu_tiers.length)})`"
                      :title="`${coreName(tier, core)} · ${core.freq_mhz} MHz · ${Math.round(core.active_ratio * 100)}%`"
                    >
                      <div class="flex items-baseline justify-between">
                        <span class="num text-[10px] font-medium text-faint" x-text="coreName(tier, core)"></span>
                        <span class="num text-sm font-semibold"><span x-num.pct="core.active_ratio"></span><span class="text-[10px] font-normal text-muted">%</span></span>
                      </div>
                      <svg viewBox="0 0 60 32" preserveAspectRatio="none" class="mt-1.5 h-12 w-full overflow-visible text-(--c)">
                        <path :d="corePaths[coreKey(tier, core)]?.area" fill="currentColor" opacity="0.16" />
                        <path :d="corePaths[coreKey(tier, core)]?.line" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
                      </svg>
                      <div class="mt-2 h-1 overflow-hidden rounded-full bg-track">
                        <span class="block h-full rounded-full bg-(--c) opacity-70 transition-transform duration-700 ease-out" :style="`transform: translateX(${(freqRatio(tier.label, core.freq_mhz) - 1) * 100}%)`"></span>
                      </div>
                      <div class="num mt-1 text-[10px] text-faint"><span x-num.ghz="core.freq_mhz"></span> GHz</div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="card space-y-4" :class="manyCores && 'lg:col-span-3 lg:grid lg:grid-cols-4 lg:gap-x-6 lg:gap-y-4 lg:space-y-0'" style="--i: 8">
          <div class="label lg:col-span-4" x-text="t('memory')"></div>
          <div>
            <div class="mb-1.5 flex justify-between text-sm">
              <span class="text-muted" x-text="t('used')"></span>
              <span class="num"><span x-num.gb="m?.memory.ram_usage"></span> / <span x-num.gb="m?.memory.ram_total"></span> GB</span>
            </div>
            <div class="bar"><span class="bg-mem" :style="`transform: translateX(${(ratio(m?.memory.ram_usage, m?.memory.ram_total) - 1) * 100}%)`"></span></div>
          </div>
          <div x-show="m?.memory.pressure_percent != null">
            <div class="mb-1.5 flex justify-between text-sm">
              <span class="text-muted"><span x-text="t('memPressure')"></span> · <span x-text="pressureText"></span></span>
              <span class="num"><span x-num.int="m?.memory.pressure_percent"></span>%</span>
            </div>
            <div class="bar"><span :style="`transform: translateX(${(clamp01((m?.memory.pressure_percent ?? 0) / 100) - 1) * 100}%); background: var(--${pressureColor})`"></span></div>
          </div>
          <div>
            <div class="mb-1.5 flex justify-between text-sm">
              <span class="text-muted">Swap</span>
              <span class="num" x-show="m?.memory.swap_total > 0"><span x-num.gb="m?.memory.swap_usage"></span> / <span x-num.gb="m?.memory.swap_total"></span> GB</span>
              <span class="text-faint" x-show="!(m?.memory.swap_total > 0)" x-text="t('notInUse')"></span>
            </div>
            <div class="bar"><span class="bg-power" :style="`transform: translateX(${(ratio(m?.memory.swap_usage, m?.memory.swap_total) - 1) * 100}%)`"></span></div>
          </div>
          <div x-show="m?.gpu_mem_alloc != null">
            <div class="mb-1.5 flex justify-between text-sm">
              <span class="text-muted" x-text="t('gpuMem')"></span>
              <span class="num"><span x-num.gb="m?.gpu_mem_in_use"></span> / <span x-num.gb="m?.gpu_mem_alloc"></span> GB</span>
            </div>
            <div class="bar"><span class="bg-gpu" :style="`transform: translateX(${(ratio(m?.gpu_mem_in_use, m?.gpu_mem_alloc) - 1) * 100}%)`"></span></div>
          </div>
        </div>
      </section>

      <!-- 网络 / 磁盘 / 散热 -->
      <section class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        <template x-for="(io, idx) in ioCards" :key="io.key">
          <div class="card" :style="`--i: ${idx + 9}`" x-show="io.a != null">
            <div class="label" x-text="io.label"></div>
            <div class="mt-3 grid grid-cols-2 gap-3">
              <div>
                <div class="flex items-center gap-1.5 text-xs text-muted"><i class="h-2 w-2 rounded-full" :style="`background: var(--${io.colorA})`"></i><span x-text="io.nameA"></span></div>
                <div class="num mt-1 text-xl font-semibold" x-num.rate="io.a"></div>
              </div>
              <div>
                <div class="flex items-center gap-1.5 text-xs text-muted"><i class="h-2 w-2 rounded-full" :style="`background: var(--${io.colorB})`"></i><span x-text="io.nameB"></span></div>
                <div class="num mt-1 text-xl font-semibold" x-num.rate="io.b"></div>
              </div>
            </div>
            <!-- 上下两半各自缩放，峰值标签就是该半边的量级参照 -->
            <div class="relative mt-3 h-20 w-full">
              <div class="chart h-full w-full" :data-spark="io.key"></div>
              <span class="num pointer-events-none absolute top-0 left-0 text-[10px] leading-none text-faint" x-text="io.peakA"></span>
              <span class="num pointer-events-none absolute bottom-0 left-0 text-[10px] leading-none text-faint" x-text="io.peakB"></span>
            </div>
            <div class="mt-2 flex items-center justify-between gap-3 text-xs text-muted">
              <span x-text="t('windowTotal')"></span>
              <span class="num flex gap-3">
                <span class="flex items-center gap-1.5"><i class="h-1.5 w-1.5 rounded-full" :style="`background: var(--${io.colorA})`"></i><span class="text-fg" x-text="io.totalA"></span></span>
                <span class="flex items-center gap-1.5"><i class="h-1.5 w-1.5 rounded-full" :style="`background: var(--${io.colorB})`"></i><span class="text-fg" x-text="io.totalB"></span></span>
              </span>
            </div>
          </div>
        </template>

        <div class="card space-y-4 md:col-span-2 lg:col-span-1" style="--i: 11">
          <div class="label" x-text="t('thermals')"></div>
          <!-- 不按 null 隐藏行：GPU 空闲断电时（如显示器熄屏）macmon 的 gpu_temp_avg 会是 null，隐藏会让卡片高度来回跳 -->
          <template x-for="tp in temps" :key="tp.key">
            <div class="flex items-center gap-3">
              <!-- 图标颜色随温度从组件色渐变到警示色，一眼能看出冷热 -->
              <svg viewBox="0 0 24 24" class="h-8 w-8 shrink-0 transition-colors duration-700" :style="`color: color-mix(in oklab, var(--${tp.color}), var(--temp) ${heat(tp.value) * 100}%)`">
                <g x-show="tp.icon === 'cpu'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                  <rect x="6" y="6" width="12" height="12" rx="2.5" />
                  <rect x="9.5" y="9.5" width="5" height="5" rx="1" fill="currentColor" stroke="none" opacity="0.9" />
                  <path d="M9.5 3v3M14.5 3v3M9.5 18v3M14.5 18v3M3 9.5h3M3 14.5h3M18 9.5h3M18 14.5h3" />
                </g>
                <g x-show="tp.icon === 'gpu'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 4v16" />
                  <path d="M3 6h16.5A1.5 1.5 0 0 1 21 7.5v8a1.5 1.5 0 0 1-1.5 1.5H3" />
                  <circle cx="10" cy="11.5" r="3" />
                  <circle cx="10" cy="11.5" r="0.9" fill="currentColor" stroke="none" />
                  <path d="M15.5 9.5h2.5M15.5 13.5h2.5M6.5 17v2.5M9.5 17v2.5M12.5 17v2.5" />
                </g>
              </svg>
              <div class="min-w-0 flex-1">
                <div class="mb-1.5 flex justify-between text-sm">
                  <span class="text-muted" x-text="tp.label"></span>
                  <span class="num"><span x-num.temp="tp.value"></span> °C</span>
                </div>
                <div class="bar"><span :style="`transform: scaleX(${clamp01((tp.value ?? 0) / 110)}); background: linear-gradient(90deg, var(--mem), var(--power) 55%, var(--temp))`"></span></div>
              </div>
            </div>
          </template>
          <template x-for="fan in (m?.fans ?? [])" :key="fan.name">
            <div class="flex items-center gap-3">
              <svg viewBox="0 0 24 24" class="h-8 w-8 shrink-0 text-cpu" x-spin="fan.max_rpm ? fan.rpm / fan.max_rpm : 0">
                <g fill="currentColor" opacity="0.9">
                  <path d="M12 10.5c-.4-3.6.6-7 3.3-7.4 2.6-.4 3.6 3.1.6 5.2-1.2.9-2.6 1.6-3.9 2.2Z" />
                  <path d="M13.5 12c3.6-.4 7 .6 7.4 3.3.4 2.6-3.1 3.6-5.2.6-.9-1.2-1.6-2.6-2.2-3.9Z" />
                  <path d="M12 13.5c.4 3.6-.6 7-3.3 7.4-2.6.4-3.6-3.1-.6-5.2 1.2-.9 2.6-1.6 3.9-2.2Z" />
                  <path d="M10.5 12c-3.6.4-7-.6-7.4-3.3-.4-2.6 3.1-3.6 5.2-.6.9 1.2 1.6 2.6 2.2 3.9Z" />
                </g>
                <circle cx="12" cy="12" r="1.6" fill="currentColor" />
              </svg>
              <div class="min-w-0 flex-1">
                <div class="mb-1.5 flex justify-between text-sm">
                  <span class="text-muted" x-text="t('fan', fan.name.replace('fan', ''))"></span>
                  <span class="num"><span x-num.int="fan.rpm"></span> <span class="text-faint" x-text="`/ ${fan.max_rpm} RPM`"></span></span>
                </div>
                <div class="bar"><span class="bg-cpu" :style="`transform: translateX(${(ratio(fan.rpm, fan.max_rpm) - 1) * 100}%)`"></span></div>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- 网络延迟：仅在服务端用 -probe 开启时显示 -->
      <section class="card" style="--i: 12" x-cloak x-show="latEnabled || latError">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <div class="flex min-w-0 flex-wrap items-baseline gap-x-3 gap-y-1">
            <div class="label" x-text="t('latency')"></div>
            <span class="text-xs text-faint" x-show="latEnabled" x-text="latHintText"></span>
          </div>
          <div class="flex flex-wrap items-center justify-end gap-2">
            <!-- 拖选放大后出现：显示所选时间段，可前后平移或退出放大 -->
            <div class="lat-zoom" x-cloak x-show="latZoom" x-transition.opacity.duration.200ms>
              <button type="button" class="lat-zoom-btn" :disabled="!latPan.prev" :title="t('lat.prev')" :aria-label="t('lat.prev')" @click="panLat(-1)">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
              </button>
              <span class="num px-1 text-[11px] font-medium text-fg" x-text="latZoomText"></span>
              <span class="num text-[11px] text-muted" x-text="latZoomSpan"></span>
              <button type="button" class="lat-zoom-btn" :disabled="!latPan.next" :title="t('lat.next')" :aria-label="t('lat.next')" @click="panLat(1)">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
              </button>
              <i class="h-3.5 w-px bg-line"></i>
              <button type="button" class="lat-zoom-btn" :title="t('lat.reset')" :aria-label="t('lat.reset')" @click="resetLatZoom()">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" class="h-3.5 w-3.5"><path d="m4.5 4.5 7 7m0-7-7 7" /></svg>
              </button>
            </div>
            <div class="seg" role="group" :aria-label="t('latency')">
              <template x-for="r in latRanges" :key="r">
                <button type="button" class="seg-btn num" :class="!latZoom && r === latRange && 'is-on'" :aria-pressed="!latZoom && r === latRange" @click="setLatRange(r)" x-text="r"></button>
              </template>
            </div>
          </div>
        </div>

        <!-- 目标卡片：悬停高亮曲线，点击显示/隐藏 -->
        <div class="grid gap-3" x-ref="latGrid" :style="`grid-template-columns: repeat(${latCols(latRows.length)}, minmax(0, 1fr))`">
          <!-- 用 div[role=button] 而不是 <button>：卡片里有块级元素和 dl，button 只允许行内内容，读屏器也会把所有数值拼成一个超长按钮名 -->
          <template x-for="(row, ri) in latRows" :key="row.id">
            <div
              role="button"
              tabindex="0"
              class="lat-tile cursor-pointer"
              :class="latHidden[row.id] && 'is-off'"
              :style="`--c: var(--${row.color})`"
              :aria-pressed="!latHidden[row.id]"
              :aria-label="row.name"
              @click="toggleLat(row.id)"
              @keydown.enter.prevent="toggleLat(row.id)"
              @keydown.space.prevent="toggleLat(row.id)"
              @mouseenter="focusLat(row.id)"
              @mouseleave="focusLat(null)"
              @focus="focusLat(row.id)"
              @blur="focusLat(null)"
            >
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <i class="lat-swatch"></i>
                    <span class="truncate text-sm font-medium text-fg" x-text="row.name"></span>
                  </div>
                  <div class="num mt-1 truncate text-[11px] text-faint">
                    <span :title="t(`lat.${row.mode}Tip`)" x-text="t(`lat.${row.mode}`)"></span> · <span x-text="row.addr"></span>
                  </div>
                </div>
                <span class="lat-pill" :style="row.stateColor && `--s: var(--${row.stateColor})`" :class="!row.state && 'is-none'">
                  <i></i><span x-text="t(`lat.s.${row.state ?? 'none'}`)"></span>
                </span>
              </div>

              <div class="mt-3 flex items-baseline gap-1">
                <template x-if="row.value != null || row.state !== 'down'">
                  <span class="flex items-baseline gap-1">
                    <span class="num text-3xl font-semibold tracking-tight text-fg" x-num.temp="row.value"></span>
                    <span class="text-xs text-muted">ms</span>
                  </span>
                </template>
                <template x-if="row.value == null && row.state === 'down'">
                  <span class="text-2xl font-semibold text-temp" x-text="t('lat.timeout')"></span>
                </template>
              </div>

              <div class="lat-strip mt-3" aria-hidden="true">
                <template x-for="(b, bi) in (latBucketRows[ri] ?? [])" :key="bi">
                  <span :class="bi === latHoverBucket && 'is-on'" :data-s="b.state" :style="b.color && `background: var(--${b.color})`" :title="b.title"></span>
                </template>
              </div>

              <dl class="mt-3 grid gap-2" :style="`grid-template-columns: repeat(${row.stats.length}, minmax(0, 1fr))`">
                <template x-for="[k, v, unit] in row.stats" :key="k">
                  <div class="min-w-0">
                    <dt class="text-[10px] tracking-wide text-faint uppercase" x-text="k"></dt>
                    <dd class="num mt-0.5 truncate text-[13px] text-fg"><span x-text="v"></span><span class="ml-0.5 text-[10px] text-faint" x-show="v !== '—'" x-text="unit"></span></dd>
                  </div>
                </template>
              </dl>
            </div>
          </template>
        </div>

        <div class="relative mt-5">
          <div x-ref="latChart" class="lat-chart chart h-56 w-full transition-opacity duration-300" :class="latLoading && 'opacity-40'"></div>
          <!-- 拖选的选区和时间标签由 attachLatBrush 直接改 DOM，不经过 Alpine：pointermove 每帧都触发 -->
          <div class="lat-sel" x-ref="latSel" hidden></div>
          <div class="lat-sel-label" x-ref="latSelLabel" hidden><span></span><span></span></div>
          <div class="lat-tip" x-show="latTip && latTipRows.length" :style="latTipStyle">
            <div class="num mb-1.5 text-[11px] text-muted" x-text="latTipTime"></div>
            <template x-for="r in latTipRows" :key="r.id">
              <div class="flex items-center gap-2 py-0.5 text-xs">
                <i class="h-[3px] w-3 shrink-0 rounded-full" :style="`background: var(--${r.color})`"></i>
                <span class="min-w-0 flex-1 truncate text-muted" x-text="r.name"></span>
                <span class="num font-medium" :class="r.bad ? 'text-temp' : 'text-fg'" x-text="r.value"></span>
                <span class="num text-[10px] text-temp" x-show="r.loss" x-text="r.loss"></span>
              </div>
            </template>
          </div>
          <div class="pointer-events-none absolute inset-0 grid place-items-center text-sm text-faint" x-show="latEnabled && latEmpty" x-text="t('lat.empty')"></div>
        </div>
        <div class="mt-2 flex items-start justify-between gap-3">
          <p class="text-xs text-temp" x-show="latError" x-text="latError"></p>
          <!-- 触屏不支持拖选（见 attachLatBrush），不显示这句提示 -->
          <p class="ml-auto text-[11px] text-faint pointer-coarse:hidden" x-show="latEnabled && !latEmpty" x-text="t('lat.dragHint')"></p>
        </div>
      </section>

      <footer class="pt-2 text-center text-xs text-faint">
        <span x-text="t('footerSource')"></span> <span class="num">macmon pipe</span> · <span x-text="t('footerPause')"></span>
      </footer>
    </main>

    <!-- 错误提示 -->
    <div
      x-cloak
      x-show="status === 'error'"
      x-transition:enter="transition duration-300 ease-out"
      x-transition:enter-start="translate-y-4 opacity-0"
      x-transition:leave="transition duration-200 ease-in"
      x-transition:leave-end="translate-y-4 opacity-0"
      class="fixed inset-x-4 bottom-4 mx-auto max-w-xl rounded-2xl border border-line bg-surface-hi px-4 py-3 text-sm shadow-2xl backdrop-blur-xl"
    >
      <div class="font-medium text-temp" x-text="t('errTitle')"></div>
      <div class="num mt-1 break-all text-xs text-muted" x-text="error"></div>
    </div>
  </body>
</html>
